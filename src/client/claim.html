<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>دفتر کار هوشمند · دریافت رمز عبور</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      </div>
      <h1 id="title">دفتر شما آماده است 🎉</h1>
      <p class="sub" id="sub">در حال بازگشایی…</p>
      <section id="reveal" hidden>
        <p class="warn"><strong>این رمز عبور را هم‌اکنون یادداشت کنید.</strong> این رمز فقط همین یک‌بار نمایش داده می‌شود — دفتر کار فقط هش آن را نگهداری می‌کند و دیگر قابل بازیابی نخواهد بود. آن را با هم‌تیمی‌هایی که دعوت می‌کنید به اشتراک بگذارید.</p>
        <div class="secret"><code id="pw"></code><button type="button" id="copy" class="mini">کپی</button></div>
        <label class="check"><input type="checkbox" id="saved" /> آن را در جایی امن ذخیره کردم</label>
        <button type="button" id="enter" disabled>ورود به دفتر کار</button>
      </section>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>رفتن به صفحه ورود ←</a>
    </main>
    <script type="module" src="./claim.ts"></script>
  </body>
</html>
