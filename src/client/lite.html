<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff1de" />
    <title>Agent Office · دفتر کار ایجنت‌ها (۲ بعدی)</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./lite.css" />
  </head>
  <body class="lite">
    <!-- The 2D view (lite.ts): the office without the 3D, for a phone or a computer the 3D is too much for. -->
    <header class="lite-bar">
      <label class="lite-floor" title="طبقه فعلی: برای دیدن کارمندان، طبقه دیگری را انتخاب کنید">
        <span class="lite-floor-label">طبقه</span>
        <select id="floor" aria-label="طبقه"></select>
      </label>
      <a id="to-3d" class="btn" href="/?3d=1" title="دفتر کار ۳ بعدی">🏢 نمای ۳ بعدی</a>
    </header>
    <main class="lite-main">
      <p id="floor-meta" class="lite-meta"></p>
      <div id="elsewhere" class="lite-elsewhere hidden"></div>
      <h2 class="lite-h">کارمندان <span id="waiting-now" class="lite-waiting"></span></h2>
      <ul id="workers" class="lite-workers"></ul>
    </main>
    <nav class="lite-nav" aria-label="Office">
      <button id="btn-issues" class="btn" type="button">📌 مسائل <span class="n"></span></button>
      <button id="btn-pulls" class="btn" type="button">🔀 درخواست‌های ادغام <span class="n"></span></button>
      <button id="btn-queue" class="btn" type="button">📋 صف کارها <span class="n"></span></button>
      <button id="btn-new" class="btn primary" type="button">✨ وظیفه جدید</button>
    </nav>
    <div id="toasts"></div>
    <div id="conn" class="conn hidden">در حال اتصال مجدد…</div>
    <div id="modal-root"></div>
    <script type="module" src="./lite.ts"></script>
  </body>
</html>
