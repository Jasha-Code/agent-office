<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · ورود به دفتر کار</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      </div>
      <h1>دفتر کار ایجنت‌ها</h1>
      <p class="sub" id="sub">تق تق! رمز عبور چیست؟</p>
      <form id="form">
        <label id="name-row" hidden>نام شما<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" /></label>
        <label>رمز عبور<input id="password" type="password" autocomplete="current-password" autofocus required /></label>
        <p id="name-note" class="note" hidden>اگر از رمز مشترک دفتر استفاده می‌کنید، فیلد نام را خالی بگذارید.</p>
        <button type="submit" id="submit">بفرمایید داخل</button>
        <p id="error" class="error" role="alert"></p>
      </form>
    </main>
    <script type="module" src="./login.ts"></script>
  </body>
</html>
